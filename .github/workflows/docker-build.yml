name: Build and Push Docker Images

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set version
        id: vars
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push user-service
        run: |
          docker build -t shagunbawaniya19/user-service:${{ steps.vars.outputs.VERSION }} ./user-service
          docker push shagunbawaniya19/user-service:${{ steps.vars.outputs.VERSION }}

      - name: Build and push product-service
        run: |
          docker build -t shagunbawaniya19/product-service:${{ steps.vars.outputs.VERSION }} ./product-service
          docker push shagunbawaniya19/product-service:${{ steps.vars.outputs.VERSION }}

      - name: Build and push profile-service
        run: |
          docker build -t shagunbawaniya19/profile-service:${{ steps.vars.outputs.VERSION }} ./profile-service
          docker push shagunbawaniya19/profile-service:${{ steps.vars.outputs.VERSION }}

      - name: Build and push api-gateway
        run: |
          docker build -t shagunbawaniya19/api-gateway:${{ steps.vars.outputs.VERSION }} ./api-gateway
          docker push shagunbawaniya19/api-gateway:${{ steps.vars.outputs.VERSION }}